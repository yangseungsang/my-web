<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'My Web Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      markdown: {
        renderer: {
          link: function(href, title, text) {
            // downloads 폴더로 가는 링크는 Docsify 처리를 우회하고 강제 다운로드 속성 추가
            if (href.indexOf('downloads/') > -1) {
               // href에서 혹시 붙었을지 모를 .md 제거 (여기서는 원본 href가 옴)
               return '<a href="' + href + '" target="_self" download>' + text + '</a>';
            }
            // 그 외 링크는 기본 동작 수행
            return this.origin.link.apply(this, arguments);
          }
        }
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
